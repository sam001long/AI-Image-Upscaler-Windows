name: Sync selected YouTube video

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-youtube.yml"
      - "scripts/update_youtube.py"
      - "promo.json"

permissions:
  contents: write

concurrency:
  group: youtube-cache-main
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync selected YouTube video
        run: python scripts/update_youtube.py

      - name: Commit updated cache
        shell: bash
        run: |
          if git diff --quiet -- latest_video.json; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest_video.json
          git commit -m "Update selected YouTube video"
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort
              echo "Rebase conflict; cache was not pushed"
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
          done
          echo "Push failed after 3 attempts"
          exit 1
