name: Update YouTube latest video

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-youtube.yml"
      - "scripts/update_youtube.py"
      - "promo.json"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch latest YouTube video
        run: python scripts/update_youtube.py

      - name: Commit updated cache
        shell: bash
        run: |
          if git diff --quiet -- latest_video.json; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest_video.json
          git commit -m "Update latest YouTube video"
          git push
