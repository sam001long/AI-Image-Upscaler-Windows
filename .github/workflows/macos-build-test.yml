name: macOS Build Test

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "macos/**"
      - ".github/workflows/macos-build-test.yml"

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Apple Silicon
            runner: macos-15
          - name: Intel
            runner: macos-15-intel

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: System info
        run: |
          sw_vers
          uname -a
          uname -m
          sysctl -n hw.memsize

      - name: Extract BigIMG macOS project
        run: |
          rm -rf macos/buildsrc
          mkdir -p macos/buildsrc
          ditto -x -k macos/BigIMG_macOS_v1_0_BUILD_PROJECT.zip macos/buildsrc
          ls -la macos/buildsrc/BigIMG_macOS_v1_0

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: macos/buildsrc/BigIMG_macOS_v1_0/requirements.txt

      - name: Install Python dependencies
        working-directory: macos/buildsrc/BigIMG_macOS_v1_0
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Python and Tkinter smoke test
        working-directory: macos/buildsrc/BigIMG_macOS_v1_0
        run: |
          python -m py_compile app_mac.py
          python - <<'PY'
          import tkinter
          from PIL import Image
          import cv2
          import numpy
          print("tkinter:", tkinter.TkVersion)
          print("Pillow:", Image.__version__)
          print("OpenCV:", cv2.__version__)
          print("NumPy:", numpy.__version__)
          PY

      - name: Install Real-ESRGAN macOS engine
        working-directory: macos/buildsrc/BigIMG_macOS_v1_0
        run: |
          chmod +x INSTALL_ENGINE_MAC.command
          ./INSTALL_ENGINE_MAC.command
          test -x engine/realesrgan-ncnn-vulkan
          file engine/realesrgan-ncnn-vulkan
          ls -la engine
          if [ -d engine/models ]; then
            find engine/models -maxdepth 1 -type f -print
          fi

      - name: Build BigIMG.app
        working-directory: macos/buildsrc/BigIMG_macOS_v1_0
        run: |
          chmod +x BUILD_MAC.command
          ./BUILD_MAC.command
          test -d dist/BigIMG.app
          test -f dist/BigIMG.app/Contents/Info.plist
          test -x dist/BigIMG.app/Contents/MacOS/BigIMG

      - name: Inspect app bundle
        working-directory: macos/buildsrc/BigIMG_macOS_v1_0
        run: |
          plutil -p dist/BigIMG.app/Contents/Info.plist
          file dist/BigIMG.app/Contents/MacOS/BigIMG
          file dist/BigIMG.app/Contents/MacOS/engine/realesrgan-ncnn-vulkan
          du -sh dist/BigIMG.app

      - name: Ad-hoc sign and verify
        working-directory: macos/buildsrc/BigIMG_macOS_v1_0
        run: |
          codesign --force --deep --sign - dist/BigIMG.app
          codesign --verify --deep --strict --verbose=2 dist/BigIMG.app

      - name: Package app
        working-directory: macos/buildsrc/BigIMG_macOS_v1_0
        run: |
          tar -czf "BigIMG-macOS-v1.0-${{ matrix.runner }}.tar.gz" -C dist BigIMG.app
          shasum -a 256 "BigIMG-macOS-v1.0-${{ matrix.runner }}.tar.gz"

      - name: Upload BigIMG.app artifact
        uses: actions/upload-artifact@v4
        with:
          name: BigIMG-macOS-v1.0-${{ matrix.runner }}
          path: macos/buildsrc/BigIMG_macOS_v1_0/BigIMG-macOS-v1.0-${{ matrix.runner }}.tar.gz
          if-no-files-found: error
          retention-days: 14
